<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Just Game Engine — a comprehensive 2D game engine built for Flutter with ECS, physics, rendering, and more.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Just Game Engine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Just Game Engine</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0f;
      overflow: hidden;
    }

    .loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0a0a0f;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    .loader-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(245, 116, 111, 0.1);
      border-top-color: #F5746F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 24px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading Please Wait...</div>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 300);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoader);
    
    // Fallback: hide after 10 seconds if event doesn't fire
    setTimeout(hideLoader, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
