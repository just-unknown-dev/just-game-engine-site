name: just_game_engine_site
description: "Official website for Just Game Engine — a comprehensive 2D game engine built for Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.2
  firebase_remote_config: ^6.2.0

  # Routing
  auto_route: ^11.1.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # UI
  google_fonts: ^8.0.2
  lottie: ^3.3.2
  url_launcher: ^6.3.1

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.0.0
  build_runner: ^2.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/animations/
